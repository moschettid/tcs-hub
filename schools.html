<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer & Winter Schools - TCS Hub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="header"></div>

    <div class="page-header">
        <div class="container">
            <h1>Summer & Winter Schools</h1>
            <p>Intensive programs and educational opportunities in theoretical computer science</p>
        </div>
    </div>

    <main class="container">
        <section class="content-section">
            <div class="table-container">
                <table id="schools-table" class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Place</th>
                            <th>Dates</th>
                            <th>Deadline</th>
                            <th>Time Until Deadline</th>
                        </tr>
                    </thead>
                    <tbody id="schools-tbody">
                        <tr>
                            <td colspan="5" class="loading">Loading schools data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="footer-content"></div>
    <script src="js/script.js"></script>
    <script src="js/schools.js"></script>
</body>
</html>
